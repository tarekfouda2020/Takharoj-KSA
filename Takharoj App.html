<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Takharoj App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@400;500;600;700&family=Great+Vibes&display=swap">
<style>
/* Layout: app only — the phone screen fills a real phone; on larger screens a single centered device frame, nothing around it.
   App direction: Cupertino glass — frosted layers over a slow living aurora, navy depth, teal for property, sand for cars. */
:root{
  --bg:#E6ECEE; --panel:#FFFFFF; --ink:#0E1B2C; --muted:#5B6976; --line:#D3DCE0; --accent:#1F7A6E; --accent-soft:#DDF0EC;
  --f-display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic",-apple-system,Tahoma,"Segoe UI",sans-serif;
  --f-script:"Great Vibes","Brush Script MT",cursive;
  /* app (single deliberate look) */
  --a-navy:#0B1626; --a-navy2:#14294A; --a-teal:#1F7A6E; --a-teal2:#2A9A88; --a-mint:#4FDDBF;
  --a-sand:#B8925A; --a-sand-l:#EACB93; --a-ink:#0E1B2C; --a-muted:#66727F; --a-bg:#EDF2F3;
  --a-red:#D2452F; --a-red-s:rgba(210,69,47,.10); --a-green:#13865A; --a-green-s:rgba(19,134,90,.11);
  --g-fill:rgba(255,255,255,.58); --g-strong:rgba(255,255,255,.82); --g-stroke:rgba(255,255,255,.75);
  --g-sep:rgba(14,27,44,.07); --g-shadow:0 10px 30px -14px rgba(14,27,44,.22),0 1px 0 rgba(255,255,255,.6) inset;
  --g-blur:blur(22px) saturate(180%);
  --gd-fill:rgba(255,255,255,.09); --gd-stroke:rgba(255,255,255,.18);
  --sb:50px; --hb:26px;
  --spring:cubic-bezier(.34,1.56,.64,1); --ease:cubic-bezier(.22,1,.36,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#070E16; --panel:#0F1A26; --ink:#E5ECF1; --muted:#93A2AF; --line:#22323F; --accent:#4FDDBF; --accent-soft:#123833; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#070E16; --panel:#0F1A26; --ink:#E5ECF1; --muted:#93A2AF; --line:#22323F; --accent:#4FDDBF; --accent-soft:#123833; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg); color:var(--ink); font-family:var(--f-body); margin:0}
button,input,select{font:inherit; color:inherit}
button{cursor:pointer; -webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

/* ---------- stage: phone only ---------- */
html,body{height:100%}
body{overflow:hidden}
.stage{position:fixed; inset:0; display:grid; place-items:center; padding:24px; background:var(--bg); overflow:auto}
.phone{width:390px; height:844px; max-height:calc(100dvh - 48px); border-radius:56px; background:#090C10; padding:11px; position:relative;
  box-shadow:0 40px 80px -30px rgba(11,22,38,.55),0 0 0 1.5px #2A3038 inset,0 0 0 4px #14181D inset}
.app{touch-action:manipulation}
/* real phones: the app is the whole screen; the device draws its own status bar */
@media (max-width:600px){
  .stage{padding:0; background:var(--a-bg); display:block; overflow:hidden}
  .phone{width:100%; height:100%; max-height:none; border-radius:0; padding:0; box-shadow:none; background:transparent}
  .app{border-radius:0!important; --sb:calc(env(safe-area-inset-top,0px) + 8px); --hb:max(14px,env(safe-area-inset-bottom,0px))}
  .sbar > *{display:none}
  .app .inp input,.app .sx-in input{font-size:16px}
}
/* ---------- app shell ---------- */
.app{direction:rtl; width:100%; height:100%; border-radius:46px; overflow:hidden; background:var(--a-bg); color:var(--a-ink); position:relative; font-size:14px; isolation:isolate}
.app *{scrollbar-width:none}
.app ::-webkit-scrollbar{display:none}
.amb{position:absolute; inset:-20%; z-index:0; pointer-events:none}
.amb i{position:absolute; border-radius:50%; filter:blur(50px); opacity:.65}
.amb i:nth-child(1){width:60%; height:40%; top:8%; right:2%; background:#9FE8D7; animation:drift1 18s ease-in-out infinite alternate}
.amb i:nth-child(2){width:55%; height:38%; top:44%; left:4%; background:#BFD3F2; animation:drift2 22s ease-in-out infinite alternate}
.amb i:nth-child(3){width:45%; height:32%; bottom:4%; right:16%; background:#F4DDB2; animation:drift1 26s ease-in-out infinite alternate-reverse}
.app.car .amb i:nth-child(1){background:#F1D7A6}
.app.car .amb i:nth-child(3){background:#A9E6D8}
@keyframes drift1{to{transform:translate(-18%,12%) scale(1.15)}}
@keyframes drift2{to{transform:translate(16%,-10%) scale(1.1)}}

.screen{position:absolute; inset:0; z-index:1}
.screen.push{animation:push .45s var(--ease) both}
.screen.pop{animation:pop .45s var(--ease) both}
.screen.fade{animation:fadeIn .35s ease both}
@keyframes push{from{transform:translateX(-28%); opacity:.3}to{transform:none; opacity:1}}
@keyframes pop{from{transform:translateX(28%); opacity:.3}to{transform:none; opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.splash.out{animation:spOut .45s var(--ease) both; pointer-events:none}
@keyframes spOut{to{opacity:0; transform:scale(1.08); filter:blur(6px)}}
.screen.enter{animation:enterIn .65s var(--ease) both}
@keyframes enterIn{from{opacity:0; transform:scale(.95)}to{opacity:1; transform:none}}
.splash{cursor:pointer}
.scroll{position:absolute; inset:0; overflow-y:auto; overflow-x:hidden; overscroll-behavior:contain}

.glass{background:var(--g-fill); -webkit-backdrop-filter:var(--g-blur); backdrop-filter:var(--g-blur); border:1px solid var(--g-stroke); box-shadow:var(--g-shadow)}
.gtop{position:absolute; inset:0 0 auto 0; z-index:10; background:rgba(242,246,247,.66); -webkit-backdrop-filter:var(--g-blur); backdrop-filter:var(--g-blur); border-bottom:.5px solid rgba(14,27,44,.1)}
.gtop.float{transform:translateY(-100%); transition:transform .35s var(--ease)}
.gtop.float.show{transform:none}
.gbot{position:absolute; inset:auto 0 0 0; z-index:10}
.sbar{height:var(--sb); display:flex; align-items:center; justify-content:space-between; padding:2px 32px 0 30px; font-weight:600; font-size:15.5px; direction:ltr; font-family:-apple-system,"SF Pro Text",var(--f-body)}
.sbar .island{width:120px; height:34px; background:#000; border-radius:20px}
.sbar .ic{display:flex; gap:6px; align-items:center}
.sbar.light{color:#fff}
.sbar.abs{position:absolute; inset:0 0 auto 0; z-index:11}
.ahead{display:flex; align-items:center; justify-content:space-between; padding:2px 14px 10px; gap:10px; min-height:50px}
.wm{display:flex; align-items:center; gap:8px; line-height:1}
.wm .mk{width:30px; height:30px; border-radius:9px; display:grid; place-items:center; color:var(--a-mint); background:linear-gradient(160deg,#1B4068,var(--a-navy)); box-shadow:0 4px 10px -4px rgba(11,22,38,.5),0 1px 0 rgba(255,255,255,.18) inset}
.app.car .wm .mk{color:var(--a-sand-l)}
.wm .mk svg{width:19px; height:19px}
.wm b{font-family:var(--f-display); font-weight:700; font-size:21px}
.wm.light{color:#fff} .wm.light .mk{background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.2)}
.cbtn{width:38px; height:38px; display:grid; place-items:center; border-radius:50%; border:1px solid var(--g-stroke); background:var(--g-fill); -webkit-backdrop-filter:var(--g-blur); backdrop-filter:var(--g-blur); color:var(--a-ink); position:relative; flex:none}
.cbtn.dark{background:var(--gd-fill); border-color:var(--gd-stroke); color:#fff}
.cbtn .dot{position:absolute; top:7px; right:8px; width:8px; height:8px; border-radius:50%; background:var(--a-red); box-shadow:0 0 0 2px var(--a-navy)}
.navtitle{font-family:var(--f-display); font-weight:600; font-size:16px; display:flex; flex-direction:column; align-items:center; line-height:1.2}
.navtitle small{font-family:var(--f-body); font-weight:500; font-size:11px; color:var(--a-muted)}
.largetitle{padding:4px 18px 10px; font-family:var(--f-display); font-weight:700; font-size:30px; letter-spacing:-.01em; margin:0}

svg.i{width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex:none}
svg.i.s{width:16px; height:16px} svg.i.xs{width:13px; height:13px; stroke-width:2.2} svg.i.l{width:24px; height:24px}

/* iOS segmented */
.seg{position:relative; display:grid; grid-template-columns:1fr 1fr; padding:3px; border-radius:12px; background:rgba(118,118,128,.14); margin:0 16px 10px}
.seg .thumb-s{position:absolute; top:3px; bottom:3px; right:3px; width:calc(50% - 3px); border-radius:9px; background:#fff; box-shadow:0 3px 8px rgba(0,0,0,.12),0 0 1px rgba(0,0,0,.1); transition:transform .4s var(--spring)}
.seg[data-i="1"] .thumb-s{transform:translateX(-100%)}
.seg button{position:relative; z-index:1; border:0; background:transparent; padding:7px; font-weight:600; font-size:13px; display:flex; align-items:center; justify-content:center; gap:6px; color:var(--a-ink)}
.seg.dark{background:rgba(255,255,255,.12)}
.seg.dark button{color:rgba(255,255,255,.7)}
.seg.dark button[aria-pressed="true"]{color:var(--a-navy)}

/* tab bar */
.tabbar{margin:0 18px var(--hb); height:56px; border-radius:22px; display:grid; grid-template-columns:repeat(5,1fr); align-items:center; padding:0 4px; position:relative}
.tabbar button{border:0; background:transparent; display:flex; flex-direction:column; align-items:center; gap:2px; font-size:10px; font-weight:500; color:#76818C; padding:4px 0; position:relative; z-index:1; transition:color .25s}
.tabbar button[aria-current="true"]{color:var(--a-teal); font-weight:600}
.app.car .tabbar button[aria-current="true"]{color:#8A6430}
.tabbar button svg.i{width:19px; height:19px}
.tabbar .pillbg{position:absolute; top:6px; height:44px; width:calc((100% - 8px)/5); right:4px; border-radius:22px; background:rgba(31,122,110,.12); transition:transform .5s var(--spring); z-index:0}
.app.car .tabbar .pillbg{background:rgba(184,146,90,.14)}
.tabbar .mid{width:42px; height:42px; border-radius:14px; justify-self:center; display:grid; place-items:center; color:#fff;
  background:linear-gradient(160deg,var(--a-teal2),var(--a-teal) 60%,#155E55); box-shadow:0 6px 14px -6px rgba(31,122,110,.7),0 1px 0 rgba(255,255,255,.3) inset; padding:0}
.app.car .tabbar .mid{background:linear-gradient(160deg,#D4B077,var(--a-sand) 60%,#8A6430); box-shadow:0 6px 14px -6px rgba(184,146,90,.7),0 1px 0 rgba(255,255,255,.3) inset}
.tabbar .mid svg.i{width:20px; height:20px; stroke-width:2.2}

/* type + atoms */
.h-display{font-family:var(--f-display); font-weight:700; letter-spacing:-.01em; text-wrap:balance; margin:0}
.muted{color:var(--a-muted)}
.num{font-variant-numeric:tabular-nums; font-family:var(--f-display); font-weight:600}
.cur{font-size:.68em; font-weight:500; margin-inline-start:3px}
.pad{padding:12px 16px 108px; display:flex; flex-direction:column; gap:18px}
.card{background:var(--g-fill); -webkit-backdrop-filter:var(--g-blur); backdrop-filter:var(--g-blur); border:1px solid var(--g-stroke); box-shadow:var(--g-shadow); border-radius:22px}
.sec-t{display:flex; justify-content:space-between; align-items:center; gap:10px}
.sec-t h3{font-family:var(--f-display); font-size:17px; margin:0; display:flex; align-items:center; gap:7px}
.link{border:0; background:transparent; color:var(--a-teal); font-weight:600; font-size:13px; padding:0; display:inline-flex; align-items:center; gap:2px}
.app.car .link{color:#8A6430}
.btn{border:0; border-radius:15px; padding:13px 16px; font-weight:600; font-size:14.5px; display:inline-flex; align-items:center; justify-content:center; gap:8px; transition:transform .2s var(--spring)}
.btn:active{transform:scale(.97)}
.btn.pri{color:#fff; background:linear-gradient(170deg,var(--a-teal2),var(--a-teal) 55%,#176A5F); box-shadow:0 10px 20px -10px rgba(31,122,110,.8),0 1px 0 rgba(255,255,255,.3) inset}
.app.car .btn.pri{background:linear-gradient(170deg,#CDA86E,var(--a-sand) 55%,#93703F); box-shadow:0 10px 20px -10px rgba(184,146,90,.8),0 1px 0 rgba(255,255,255,.3) inset}
.btn.dark{background:var(--a-navy); color:#fff}
.btn.gl{background:var(--g-strong); border:1px solid var(--g-stroke); color:var(--a-ink); -webkit-backdrop-filter:var(--g-blur); backdrop-filter:var(--g-blur)}
.btn.gl-d{background:var(--gd-fill); border:1px solid var(--gd-stroke); color:#fff; -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px)}
.btn.block{width:100%}
.pill{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; padding:4px 9px; border-radius:999px; white-space:nowrap}
.pill.ok{background:var(--a-green-s); color:var(--a-green)}
.pill.feat{background:rgba(255,190,80,.18); color:#8A5A12}
.pill.hot{background:var(--a-red-s); color:var(--a-red)}
.pill.neu{background:rgba(118,118,128,.12); color:var(--a-muted)}
.pill.glass{background:rgba(255,255,255,.78); -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px); color:var(--a-ink)}
.pill.live{background:rgba(210,69,47,.12); color:var(--a-red)}
.pulse{width:7px; height:7px; border-radius:50%; background:currentColor; position:relative}
.pulse::after{content:""; position:absolute; inset:0; border-radius:50%; background:currentColor; animation:ping 1.6s ease-out infinite}
@keyframes ping{to{transform:scale(3); opacity:0}}

/* ---------- splash ---------- */
.splash{position:absolute; inset:0; background:radial-gradient(120% 80% at 50% 30%,#163256 0%,var(--a-navy) 60%,#050B14 100%); color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; overflow:hidden}
.splash .aur{position:absolute; inset:-30%; pointer-events:none}
.splash .aur i{position:absolute; border-radius:50%; filter:blur(60px); opacity:.55}
.splash .aur i:nth-child(1){width:60%; height:50%; top:10%; left:10%; background:#1F7A6E; animation:spin 14s linear infinite; transform-origin:70% 60%}
.splash .aur i:nth-child(2){width:50%; height:40%; bottom:12%; right:8%; background:#8A6430; animation:spin 18s linear infinite reverse; transform-origin:30% 40%}
@keyframes spin{to{transform:rotate(360deg)}}
.splash .grid{position:absolute; inset:0; background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px); background-size:32px 32px; mask-image:radial-gradient(circle at 50% 40%,#000 0%,transparent 65%); -webkit-mask-image:radial-gradient(circle at 50% 40%,#000 0%,transparent 65%)}
.emblem{position:relative; z-index:1; width:270px; animation:tileIn .8s var(--spring) both}
.emblem svg{width:100%; height:auto; display:block; overflow:visible}
.emblem .tw path{stroke-dasharray:420; animation:draw2 1.1s var(--ease) both}
.emblem .tw path:nth-child(2){animation-delay:.1s} .emblem .tw path:nth-child(3){animation-delay:.2s} .emblem .tw path:nth-child(4){animation-delay:.3s}
.emblem .win{animation:fadeIn .6s .7s ease both}
.emblem .car{animation:carIn .8s .55s var(--ease) both}
.emblem .beam{animation:beam 2.4s 1.2s ease-in-out infinite both}
.emblem::after{content:""; position:absolute; inset:0; background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.18) 50%,transparent 65%); background-size:250% 100%; animation:sheen 3s 1.4s ease-in-out infinite; pointer-events:none; mix-blend-mode:screen}
@keyframes draw2{from{stroke-dashoffset:420; fill-opacity:0}60%{fill-opacity:0}to{stroke-dashoffset:0; fill-opacity:1}}
@keyframes carIn{from{transform:translateX(-70px); opacity:0}to{transform:none; opacity:1}}
@keyframes beam{0%,100%{opacity:.08}50%{opacity:.26}}
.sp-word{position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; gap:10px}
.sp-name{display:flex; flex-direction:column; align-items:center; gap:8px}
.sp-name .ar{font-family:var(--f-display); font-weight:700; font-size:54px; line-height:1.15; animation:revealAr .8s .9s var(--ease) both}
@keyframes revealAr{from{clip-path:inset(0 0 0 100%); transform:translateY(10px)}to{clip-path:inset(0 0 0 0); transform:none}}
.sp-name .en{display:flex; gap:.34em; direction:ltr; font-family:var(--f-display); font-weight:500; font-size:13px; color:#D4AF6A}
.sp-name .en span{display:inline-block; animation:letter .6s var(--spring) both}
@keyframes letter{from{transform:translateY(24px); opacity:0}to{transform:none; opacity:1}}
@keyframes write{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.sp-tag{font-size:14px; color:rgba(255,255,255,.72); animation:rise .6s 1.55s var(--ease) both; text-align:center; line-height:1.8}
.sp-chips{display:flex; gap:8px; animation:rise .6s 1.7s var(--ease) both}
.sp-chips span{display:inline-flex; align-items:center; gap:6px; font-size:12px; padding:6px 12px; border-radius:99px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.16)}
.sp-load{position:absolute; bottom:calc(var(--hb) + 48px); width:120px; height:3px; border-radius:2px; background:rgba(255,255,255,.12); overflow:hidden}
.sp-load i{position:absolute; inset:0; background:linear-gradient(90deg,var(--a-mint),var(--a-sand-l)); transform-origin:right; animation:load 2.9s var(--ease) both}
@keyframes load{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.sp-foot{position:absolute; bottom:calc(var(--hb) + 14px); font-size:11px; color:rgba(255,255,255,.4); letter-spacing:.04em}
@keyframes rise{from{opacity:0; transform:translateY(14px)}to{opacity:1; transform:none}}

/* ---------- onboarding ---------- */
.onb{position:absolute; inset:0; background:radial-gradient(120% 70% at 50% 0%,#17345A 0%,var(--a-navy) 55%,#050B14 100%); color:#fff; display:flex; flex-direction:column; overflow:hidden; touch-action:pan-y}
.onb .aur{position:absolute; inset:-20%; pointer-events:none}
.onb .aur i{position:absolute; border-radius:50%; filter:blur(60px); opacity:.45; transition:all 1s var(--ease)}
.onb .aur i:nth-child(1){width:55%; height:40%; top:8%; right:5%; background:#1F7A6E; animation:drift1 12s ease-in-out infinite alternate}
.onb .aur i:nth-child(2){width:45%; height:35%; top:35%; left:0; background:#2B4F8A; animation:drift2 15s ease-in-out infinite alternate}
.onb[data-s="1"] .aur i:nth-child(1){background:#2A6FA8}
.onb[data-s="2"] .aur i:nth-child(1){background:#13865A}
.onb[data-s="3"] .aur i:nth-child(1){background:#8A6430}
.onb-top{position:relative; z-index:2; display:flex; justify-content:space-between; align-items:center; padding:4px 20px 0}
.skip{border:0; background:rgba(255,255,255,.1); color:#fff; border-radius:99px; padding:7px 14px; font-size:13px; font-weight:600; -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px)}
.onb-stage{position:relative; z-index:1; flex:1; display:flex; flex-direction:column; padding:10px 24px 0; gap:22px; min-height:0}
.ill{height:330px; position:relative; display:grid; place-items:center; flex:none}
.onb-copy{display:flex; flex-direction:column; gap:10px}
.onb-copy .eb{font-size:12px; font-weight:600; color:var(--a-mint); letter-spacing:.02em; animation:rise .6s .1s var(--ease) both}
.onb-copy h2{font-size:28px; line-height:1.35; animation:rise .6s .18s var(--ease) both}
.onb-copy h2 em{font-style:normal; color:var(--a-mint)}
.onb-copy p{margin:0; color:rgba(255,255,255,.7); line-height:1.85; font-size:14px; animation:rise .6s .26s var(--ease) both}
.onb-foot{position:relative; z-index:2; display:flex; align-items:center; justify-content:space-between; padding:16px 24px calc(var(--hb) + 14px); gap:12px}
.dots{display:flex; gap:6px}
.dots i{height:7px; width:7px; border-radius:4px; background:rgba(255,255,255,.25); transition:width .45s var(--spring),background .3s}
.dots i.on{width:26px; background:var(--a-mint)}
.nextb{height:58px; border:0; border-radius:29px; padding:0 22px 0 7px; display:inline-flex; align-items:center; gap:14px; color:#fff; font-weight:600; font-size:15.5px; position:relative; overflow:hidden;
  background:linear-gradient(160deg,rgba(255,255,255,.2),rgba(255,255,255,.06)); border:1px solid rgba(255,255,255,.24); -webkit-backdrop-filter:blur(18px); backdrop-filter:blur(18px);
  box-shadow:0 18px 34px -16px rgba(0,0,0,.7),0 1px 0 rgba(255,255,255,.3) inset; transition:transform .25s var(--spring)}
.nextb:active{transform:scale(.96)}
.nextb::before{content:""; position:absolute; inset:0; background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.22) 50%,transparent 70%); background-size:250% 100%; animation:sheen 3.2s 1s ease-in-out infinite}

.lsearch{display:flex; gap:8px; align-items:center}
.lsearch .sfield{height:46px; border-radius:14px; box-shadow:none; background:rgba(118,118,128,.12); border-color:transparent; -webkit-backdrop-filter:none; backdrop-filter:none; padding:0 12px; font-size:13px}
.fbtn{height:46px; padding:0 14px; display:inline-flex; align-items:center; gap:6px; border-radius:14px; font-weight:600; font-size:13px; border:1px solid var(--g-stroke); background:var(--g-fill)}
.lcard{overflow:hidden; display:flex; flex-direction:column; text-align:start; padding:0; cursor:pointer; animation:rise .5s var(--ease) both}
.lcard:nth-of-type(2){animation-delay:.06s} .lcard:nth-of-type(3){animation-delay:.12s} .lcard:nth-of-type(4){animation-delay:.18s}
.lbody{padding:14px 16px 16px; display:flex; flex-direction:column; gap:10px}
.ltitle{display:flex; justify-content:space-between; align-items:flex-start; gap:8px}
.ltitle h4{font-family:var(--f-display); font-size:15.5px; margin:0}
.ltitle .code{font-size:11px; color:var(--a-muted); font-variant-numeric:tabular-nums; direction:ltr}
.meta{font-size:12.5px; color:var(--a-muted)}
.price{display:flex; justify-content:space-between; align-items:flex-end; gap:10px; padding:12px; background:rgba(255,255,255,.55); border-radius:14px; border:1px solid rgba(255,255,255,.7)}
.price small{display:block; font-size:11.5px; color:var(--a-muted); margin-bottom:2px}
.price .cash{font-size:20px}
.price .gain{color:var(--a-green); font-size:14px; text-align:end}
.mini{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
.mini div{display:flex; flex-direction:column; gap:2px; font-size:11px; color:var(--a-muted)}
.mini b{font-size:12.5px; color:var(--a-ink); font-variant-numeric:tabular-nums; font-weight:600}
.dhero{position:relative; height:330px; overflow:hidden}
.dhero .thumb{position:absolute; inset:0; aspect-ratio:auto; height:100%}
.dhero .over{position:absolute; inset:auto 16px 44px 16px; display:flex; gap:6px; flex-wrap:wrap; z-index:2}
.dsheet{position:relative; margin-top:-28px; border-radius:28px 28px 0 0; background:rgba(237,242,243,.85); -webkit-backdrop-filter:var(--g-blur); backdrop-filter:var(--g-blur); z-index:3}
.dtop{position:absolute; inset:calc(var(--sb) + 2px) 14px auto 14px; z-index:11; display:flex; justify-content:space-between}
.dtop .g{display:flex; gap:8px}
.vlist{display:flex; flex-direction:column; gap:10px; padding:14px 16px}
.vitem{display:flex; align-items:center; gap:10px; font-size:13px}
.vitem .c{width:24px; height:24px; border-radius:50%; background:var(--a-green-s); color:var(--a-green); display:grid; place-items:center}
.vitem span:last-child{margin-inline-start:auto; font-size:11.5px; color:var(--a-muted)}
.table{display:flex; flex-direction:column; overflow:hidden}
.table .r{display:flex; justify-content:space-between; gap:10px; padding:12px 16px; border-top:1px solid var(--g-sep); font-size:13px}
.table .r:first-child{border-top:0}
.table .r.total{background:var(--a-green-s); color:var(--a-green); font-weight:700}
.table .r.hl{background:rgba(31,122,110,.07)}
.bars{padding:14px 16px; display:flex; flex-direction:column; gap:10px}
.bar{display:grid; grid-template-columns:76px 1fr; gap:10px; align-items:center; font-size:12px}
.bar .track{height:12px; background:rgba(118,118,128,.14); border-radius:6px; overflow:hidden; display:flex}
.bar .track i{transform-origin:right; animation:grow2 1s var(--ease) both}
@keyframes grow2{from{transform:scaleX(0)}to{transform:none}}
.bar .seg1{background:var(--seg1)} .bar .seg2{background:#9DB0BE} .bar .seg3{background:var(--a-mint)}
.legend{display:flex; gap:12px; flex-wrap:wrap; font-size:11px; color:var(--a-muted)}
.legend i{display:inline-block; width:9px; height:9px; border-radius:3px; margin-inline-end:5px; vertical-align:middle}
.sched{display:flex; flex-direction:column}
.sched .r{display:grid; grid-template-columns:1fr auto auto; gap:12px; padding:11px 16px; border-top:1px solid var(--g-sep); font-size:12.5px; align-items:center}
.sched .r:first-child{border-top:0}
.ctabar{display:grid; grid-template-columns:auto 1fr; gap:10px; padding:12px 16px var(--hb); background:rgba(242,246,247,.72); -webkit-backdrop-filter:var(--g-blur); backdrop-filter:var(--g-blur); border-top:.5px solid rgba(14,27,44,.1)}
.ring{--p:94; width:76px; height:76px; border-radius:50%; background:conic-gradient(var(--a-green) calc(var(--p)*1%),rgba(118,118,128,.18) 0); display:grid; place-items:center; flex:none}
.ring div{width:62px; height:62px; border-radius:50%; background:#F4F7F8; display:grid; place-items:center; font-family:var(--f-display); font-weight:700; font-size:19px}
.insp{display:flex; gap:14px; align-items:center; padding:14px 16px}
.insp ul{margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:6px; font-size:12.5px}
.insp li{display:flex; align-items:center; gap:6px}
.rate{display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:0 16px 16px}
.rate div{border-radius:14px; padding:10px 12px; display:flex; flex-direction:column; gap:2px; font-size:11.5px}
.rate .old{background:var(--a-green-s); color:var(--a-green)}
.rate .new{background:rgba(118,118,128,.1); color:var(--a-muted)}
.rate b{font-family:var(--f-display); font-size:20px}
.note{font-size:11.5px; color:var(--a-muted); line-height:1.75; padding:0 2px; margin:0}
.delta{background:linear-gradient(150deg,#14294A,var(--a-navy)); color:#fff; border-radius:20px; padding:15px 16px; display:flex; justify-content:space-between; align-items:center; gap:10px; position:relative; overflow:hidden}
.delta::after{content:""; position:absolute; width:140px; height:140px; left:-40px; top:-60px; border-radius:50%; background:radial-gradient(closest-side,rgba(79,221,191,.3),transparent)}
.delta small{color:rgba(255,255,255,.7); font-size:12px}
.delta .num{font-size:22px; color:var(--a-mint)}
.app.car .delta .num{color:var(--a-sand-l)}
.tabs2{position:relative; display:grid; grid-template-columns:1fr 1fr; padding:3px; border-radius:12px; background:rgba(118,118,128,.14)}
.tabs2 button{border:0; background:transparent; padding:9px; border-radius:9px; font-weight:600; font-size:13.5px; color:var(--a-ink); transition:background .3s,box-shadow .3s}
.tabs2 button[aria-pressed="true"]{background:#fff; box-shadow:0 3px 8px rgba(0,0,0,.12)}
.form{padding:16px; display:flex; flex-direction:column; gap:14px}
.field{display:flex; flex-direction:column; gap:6px}
.field label{font-size:13px; font-weight:600}
.field label .req{color:var(--a-red)}
.inp{display:flex; align-items:center; gap:8px; border-radius:14px; padding:0 14px; background:rgba(255,255,255,.7); border:1px solid rgba(14,27,44,.08); height:48px; transition:border-color .2s,box-shadow .2s}
.inp:focus-within{border-color:var(--a-teal); box-shadow:0 0 0 4px rgba(31,122,110,.12)}
.inp input{border:0; outline:0; flex:1; min-width:0; background:transparent; font-size:15px; font-variant-numeric:tabular-nums; height:100%}
.inp .u{font-size:12px; color:var(--a-muted)}
.field small{font-size:11.5px; color:var(--a-muted)}
.opts{display:flex; gap:6px; flex-wrap:wrap}
.opt{border:1px solid rgba(14,27,44,.08); background:rgba(255,255,255,.6); padding:8px 13px; border-radius:12px; font-size:12.5px; font-weight:500; transition:all .25s var(--spring)}
.opt[aria-pressed="true"]{border-color:var(--a-teal); background:rgba(31,122,110,.1); color:#155E55; font-weight:600}
.result{display:flex; flex-direction:column; gap:10px}
.rcard{padding:14px 16px; display:flex; flex-direction:column; gap:8px; border-radius:20px; animation:rise .4s var(--ease) both}
.rcard.bad{background:rgba(210,69,47,.09); border:1px solid rgba(210,69,47,.12)}
.rcard.good{background:rgba(19,134,90,.1); border:1px solid rgba(19,134,90,.14); animation-delay:.08s}
.rcard .t{display:flex; align-items:center; gap:8px; font-weight:700; font-size:13.5px}
.rcard .r{display:flex; justify-content:space-between; font-size:12.5px; gap:10px}
.rcard .r b{font-variant-numeric:tabular-nums}
.rcard .bigv{font-size:22px}
.prog{display:flex; gap:5px; padding:0 16px}
.prog i{flex:1; height:4px; border-radius:2px; background:rgba(118,118,128,.2); overflow:hidden; position:relative}
.prog i.on::after{content:""; position:absolute; inset:0; background:var(--a-teal); animation:grow2 .6s var(--ease) both}
.app.car .prog i.on::after{background:var(--a-sand)}
.wz-h{padding:12px 16px 0; display:flex; flex-direction:column; gap:4px}
.wz-h small{color:var(--a-muted); font-size:12px}
.wz-h h3{font-family:var(--f-display); font-size:22px; margin:0}
.owner{display:flex; gap:10px; padding:12px 14px; background:rgba(255,190,80,.16); border:1px solid rgba(255,190,80,.25); border-radius:16px; font-size:12px; line-height:1.7; color:#6B4A14}
.check{display:flex; gap:10px; align-items:flex-start; font-size:12.5px; line-height:1.7; padding:12px; border-radius:14px; background:rgba(31,122,110,.08)}
.check .box{width:22px; height:22px; border-radius:7px; background:var(--a-teal); color:#fff; display:grid; place-items:center; flex:none; margin-top:1px}
.ups{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.up{border:1.5px dashed rgba(14,27,44,.18); border-radius:18px; padding:14px 10px; display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center; font-size:12px; background:rgba(255,255,255,.5)}
.up.done{border-style:solid; border-color:rgba(19,134,90,.3); background:var(--a-green-s)}
.up .ic{width:38px; height:38px; border-radius:12px; background:rgba(255,255,255,.8); display:grid; place-items:center; color:var(--a-teal)}
.up.done .ic{color:var(--a-green)}
.up b{font-size:12.5px} .up small{color:var(--a-muted); font-size:11px}
.choice{display:flex; flex-direction:column; gap:10px}
.ch{display:flex; gap:12px; align-items:flex-start; padding:14px; border:1.5px solid rgba(255,255,255,.75); border-radius:20px; background:var(--g-fill); text-align:start; transition:all .3s var(--spring)}
.ch[aria-pressed="true"]{border-color:var(--a-teal); background:rgba(31,122,110,.08)}
.ch .ic{width:40px; height:40px; border-radius:13px; background:rgba(255,255,255,.8); display:grid; place-items:center; flex:none}
.ch b{display:block; font-size:14px; margin-bottom:2px}
.ch span{font-size:12px; color:var(--a-muted); line-height:1.65}
.wz-foot{display:grid; grid-template-columns:auto 1fr; gap:10px; padding:12px 16px var(--hb); background:rgba(242,246,247,.72); -webkit-backdrop-filter:var(--g-blur); backdrop-filter:var(--g-blur); border-top:.5px solid rgba(14,27,44,.1)}
.success{display:flex; flex-direction:column; align-items:center; text-align:center; gap:10px; padding:20px 20px 8px}
.success .badge{width:86px; height:86px; border-radius:50%; background:var(--a-green-s); color:var(--a-green); display:grid; place-items:center; animation:popIn .6s var(--spring) both; position:relative}
.success .badge::after{content:""; position:absolute; inset:0; border-radius:50%; border:2px solid var(--a-green); animation:ping 1.8s .4s ease-out infinite}
.success .badge svg{width:40px; height:40px}
.success .badge path{stroke-dasharray:40; animation:draw .6s .3s var(--ease) both}
.prof{position:relative; overflow:hidden; background:linear-gradient(160deg,#17345A,var(--a-navy)); color:#fff; padding:calc(var(--sb) + 8px) 18px 22px; display:flex; flex-direction:column; gap:14px}
.prof::before{content:""; position:absolute; width:260px; height:260px; border-radius:50%; left:-80px; top:-100px; background:radial-gradient(closest-side,rgba(79,221,191,.3),transparent); animation:drift1 9s ease-in-out infinite alternate}
.prof > *{position:relative}
.prof .who{display:flex; gap:12px; align-items:center}
.av{width:50px; height:50px; border-radius:17px; background:linear-gradient(160deg,var(--a-teal2),var(--a-teal)); display:grid; place-items:center; font-family:var(--f-display); font-weight:700; font-size:19px; color:#fff}
.prof .kpis{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
.prof .kpis button{position:relative; text-align:start; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.12); border-radius:14px; padding:10px; font-size:11px; color:rgba(255,255,255,.7); transition:transform .25s var(--spring),background .25s}
.prof .kpis button:active{transform:scale(.95); background:rgba(255,255,255,.14)}
.prof .kpis button svg.i{position:absolute; top:10px; left:8px; opacity:.55}
.prof .kpis b{display:block; font-family:var(--f-display); font-size:19px; color:#fff}
.tl{display:flex; flex-direction:column; padding:6px 16px 14px}
.tli{display:grid; grid-template-columns:28px 1fr; gap:12px; position:relative; padding:10px 0}
.tli:not(:last-child)::after{content:""; position:absolute; right:13px; top:38px; bottom:-8px; width:2px; background:rgba(118,118,128,.2)}
.tli.done:not(:last-child)::after{background:var(--a-teal)}
.tli .d{width:28px; height:28px; border-radius:50%; display:grid; place-items:center; background:#fff; color:var(--a-muted); border:2px solid rgba(118,118,128,.25); font-size:12px; font-weight:700}
.tli.done .d{background:var(--a-teal); border-color:var(--a-teal); color:#fff}
.tli.cur .d{border-color:var(--a-teal); color:var(--a-teal); animation:glow 1.8s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 7px rgba(31,122,110,.15)}}
.tli b{font-size:13.5px}
.tli p{margin:2px 0 0; font-size:12px; color:var(--a-muted); line-height:1.65}
.tli .pill{margin-top:6px}
.mgr{display:flex; align-items:center; gap:12px; padding:14px 16px}
.mgr .av{width:44px; height:44px; font-size:16px; background:linear-gradient(160deg,#D4B077,var(--a-sand))}
.notif{display:flex; gap:12px; padding:13px 16px; border-top:1px solid var(--g-sep); align-items:flex-start}
.notif:first-child{border-top:0}
.notif .ic{width:36px; height:36px; border-radius:12px; display:grid; place-items:center; flex:none; background:rgba(31,122,110,.1); color:var(--a-teal)}
.notif b{font-size:13px; display:block} .notif span{font-size:12px; color:var(--a-muted); line-height:1.6}
.notif time{font-size:11px; color:var(--a-muted); margin-inline-start:auto; white-space:nowrap}
.setrow{display:flex; align-items:center; gap:12px; padding:13px 16px; border-top:1px solid var(--g-sep); font-size:13.5px}
.setrow:first-child{border-top:0}
.setrow .v{margin-inline-start:auto; color:var(--a-muted); font-size:12.5px}
.sw{width:51px; height:31px; border-radius:16px; background:#34C759; position:relative; margin-inline-start:auto; border:0; transition:background .25s; flex:none}
.app .sw{background:var(--a-teal)}
.sw::after{content:""; position:absolute; top:2px; left:2px; width:27px; height:27px; border-radius:50%; background:#fff; box-shadow:0 3px 8px rgba(0,0,0,.15); transition:left .35s var(--spring)}
.sw[aria-pressed="false"]{background:rgba(118,118,128,.22)}
.sw[aria-pressed="false"]::after{left:22px}
.scrim{position:absolute; inset:0; background:rgba(11,22,38,.35); z-index:45; display:flex; align-items:flex-end; animation:fadeIn .25s ease both}
.sheet{width:100%; border-radius:30px 30px 0 0; padding:10px 16px 34px; display:flex; flex-direction:column; gap:14px; max-height:84%; overflow-y:auto; animation:sheetUp .5s var(--spring) both;
  background:rgba(246,249,250,.88); -webkit-backdrop-filter:var(--g-blur); backdrop-filter:var(--g-blur)}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
.grab{width:38px; height:5px; border-radius:3px; background:rgba(118,118,128,.35); align-self:center}
.sheet h4{font-family:var(--f-display); margin:0; font-size:17px}
.sheet .grp{display:flex; flex-direction:column; gap:8px}
.sheet .grp > span{font-size:12.5px; font-weight:600}

/* ---------- account sub-pages ---------- */
.dealhead{overflow:hidden; padding:0}
.dealhead .thumb{aspect-ratio:16/8}
.dealhead .dh{padding:14px 16px; display:flex; flex-direction:column; gap:10px}
.dealhead .amt{display:flex; justify-content:space-between; align-items:flex-end; gap:10px}
.dealhead .amt small{display:block; font-size:11.5px; color:var(--a-muted)}
.dealhead .amt .num{font-size:22px}
.nextup{display:flex; gap:12px; align-items:center; padding:14px 16px}
.nextup .cal{width:52px; height:56px; border-radius:14px; flex:none; display:flex; flex-direction:column; align-items:center; justify-content:center; background:linear-gradient(160deg,var(--a-teal2),var(--a-teal)); color:#fff; line-height:1.1}
.app.car .nextup .cal{background:linear-gradient(160deg,#CDA86E,var(--a-sand))}
.nextup .cal small{font-size:10px; opacity:.85} .nextup .cal b{font-family:var(--f-display); font-size:20px}
.nextup b{font-size:14px} .nextup p{margin:2px 0 0; font-size:12px; color:var(--a-muted)}
.docrow{display:flex; align-items:center; gap:10px; padding:12px 16px; border-top:1px solid var(--g-sep); font-size:13px}
.docrow:first-child{border-top:0}
.docrow span:last-child{margin-inline-start:auto}
.lsum{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
.lsum div{padding:12px; display:flex; flex-direction:column; gap:2px; font-size:11.5px; color:var(--a-muted)}
.lsum b{font-family:var(--f-display); font-size:20px; color:var(--a-ink)}
.lead{padding:14px 16px; display:flex; flex-direction:column; gap:12px; animation:rise .45s var(--ease) both}
.lead:nth-of-type(2){animation-delay:.06s} .lead:nth-of-type(3){animation-delay:.12s}
.lead .who{display:flex; gap:12px; align-items:center}
.lead .av{width:44px; height:44px; font-size:16px; border-radius:14px}
.lead .who b{font-size:14px; display:block}
.lead .who span{font-size:12px; color:var(--a-muted)}
.lead .tags{display:flex; gap:6px; flex-wrap:wrap}
.lead .acts{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.lead .acts .btn{padding:10px 12px; font-size:13px}
.empty{text-align:center; padding:40px 16px; color:var(--a-muted); display:flex; flex-direction:column; align-items:center; gap:10px}
.empty .ei{width:64px; height:64px; border-radius:20px; display:grid; place-items:center; background:var(--g-fill); border:1px solid var(--g-stroke)}

/* ---------- light splash + onboarding (default theme) ---------- */
.app:not(.dark) .splash{background:radial-gradient(120% 80% at 50% 30%,#FFFFFF 0%,#EEF4F5 55%,#DDE8EA 100%); color:var(--a-ink)}
.app:not(.dark) .splash .aur i{opacity:.5}
.app:not(.dark) .splash .aur i:nth-child(1){background:#A6EAD9} .app:not(.dark) .splash .aur i:nth-child(2){background:#F2DDB0}
.app:not(.dark) .splash .grid{background-image:linear-gradient(rgba(14,27,44,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(14,27,44,.05) 1px,transparent 1px)}
.app:not(.dark) .splash .sbar,.app:not(.dark) .onb .sbar{color:var(--a-ink)}
.app:not(.dark) .sp-name .en{color:#A8823F}
.app:not(.dark) .sp-tag{color:var(--a-muted)}
.app:not(.dark) .sp-chips span{background:rgba(255,255,255,.7); border-color:rgba(14,27,44,.08); color:var(--a-ink)}
.app:not(.dark) .sp-load{background:rgba(14,27,44,.08)}
.app:not(.dark) .sp-foot{color:rgba(14,27,44,.4)}
.app:not(.dark) .emblem::after{background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%); background-size:250% 100%; mix-blend-mode:normal}
.app:not(.dark) .emblem .car path:first-child{stroke-opacity:.9}
.app:not(.dark) .onb{background:radial-gradient(120% 70% at 50% 0%,#FFFFFF 0%,#EEF4F5 55%,#DFE9EB 100%); color:var(--a-ink)}
.app:not(.dark) .onb .aur i{opacity:.5}
.app:not(.dark) .onb .aur i:nth-child(1){background:#A6EAD9} .app:not(.dark) .onb .aur i:nth-child(2){background:#C6D7F3}
.app:not(.dark) .onb[data-s="1"] .aur i:nth-child(1){background:#B5D3F2}
.app:not(.dark) .onb[data-s="2"] .aur i:nth-child(1){background:#A9E6C9}
.app:not(.dark) .onb[data-s="3"] .aur i:nth-child(1){background:#F2DDB0}
.app:not(.dark) .onb .wm.light{color:var(--a-ink)}
.app:not(.dark) .skip{background:rgba(255,255,255,.7); border:1px solid rgba(14,27,44,.08); color:var(--a-ink)}
.app:not(.dark) .onb-copy .eb{color:var(--a-teal)}
.app:not(.dark) .onb-copy h2 em{color:var(--a-teal)}
.app:not(.dark).car .onb-copy .eb,.app:not(.dark).car .onb-copy h2 em{color:#9C7A3E}
.app:not(.dark) .onb-copy p{color:var(--a-muted)}

 let body;

 <div class="delta"><div><small>مكسبك عن سعر السوق من أول يوم</small><div class="num">+ <span data-count="${g}">0</span> ر.س</div></div>${ic('tag','l')}</div>
 <div class="card table"><div class="r hl"><span>المطلوب كاش للبائع (اللي دفعه بالضبط)</span><b class="num">${fmt(l.cash)}</b></div>
 <div class="r"><span>المتبقي للمطور</span><b class="num">${fmt(l.remain)}</b></div><div class="r"><span>إجمالي سعر التعاقد</span><b class="num">${fmt(c)}</b></div>
 <div class="r"><span>سعر السوق اليوم</span><b class="num">${fmt(l.market)}</b></div><div class="r"><span>عمولة المنصة 1.25% (عند الإتمام فقط)</span><b class="num">− ${fmt(fee)}</b></div>
 <div class="r total"><span>مكسبك</span><span class="num">+ ${fmt(g)} ر.س</span></div></div>
 <div class="card bars"><b style="font-size:14px">سعر العقد مقابل السوق</b>
 <div class="bar"><span>سعر عقدك</span><div class="track"><i class="seg1" style="width:${l.cash/mx*100}%"></i><i class="seg2" style="width:${l.remain/mx*100}%;animation-delay:.2s"></i></div></div>
 <div class="bar"><span>سعر السوق</span><div class="track"><i class="seg1" style="width:${l.cash/mx*100}%"></i><i class="seg2" style="width:${l.remain/mx*100}%;animation-delay:.2s"></i><i class="seg3" style="width:${(mx-c)/mx*100}%;animation-delay:.4s"></i></div></div>
 <div class="legend"><span><i style="background:var(--seg1)"></i>كاش للبائع</span><span><i style="background:#9DB0BE"></i>أقساط متبقية</span><span><i style="background:var(--a-mint)"></i>فرق السعر</span></div></div>
 <div class="sec-t"><h3>حالة التحقق</h3><span class="pill ok">4 من 4</span></div>
 <div class="card vlist">${[['عقد البيع على الخارطة','مراجَع'],['إيصالات السداد','12 إيصال'],['الرصيد المتبقي','مؤكد من المطور'],['قابلية التنازل','موافقة مبدئية']].map(v=>`<div class="vitem"><span class="c">${ic('check','xs')}</span><span>${v[0]}</span><span>${v[1]}</span></div>`).join('')}</div>
 <div class="sec-t"><h3>الأقساط القادمة</h3><span class="muted" style="font-size:12px">${l.freq}</span></div>
 <div class="card sched">${['يناير 2027','أبريل 2027','يوليو 2027','أكتوبر 2027'].map((d,i)=>`<div class="r"><span>${d}</span><span class="muted">قسط ${i+9}</span><b class="num">${fmt(l.inst)}</b></div>`).join('')}</div>
 <p class="note">الأرقام استرشادية وتعتمد على بنود العقد الفعلي. سعر السوق من صاحب الوحدة ومسؤوليته وليس تقييمًا من المنصة. تخارج منصة وساطة وليست طرفًا في عقد الوحدة.</p>`;}
 else{const k=carCalc(l);
 body=`<div><span class="ltitle"><span class="code">${l.code}</span></span><h2 class="h-display" style="font-size:23px">${l.make} ${l.model} ${l.year}</h2><div class="meta" style="margin-top:4px">${l.city} · ${fmt(l.km)} كم · ${l.gear} · ${l.color}</div></div>
 <div class="delta"><div><small>توفيرك المتوقع طول مدة التمويل</small><div class="num">+ <span data-count="${k.gain}">0</span> ر.س</div></div>${ic('tag','l')}</div>
 <div class="card"><div class="sec-t" style="padding:14px 16px 10px"><b style="font-size:14px">نسبة الربح</b><span class="muted" style="font-size:12px">ثابتة حتى آخر قسط</span></div>
 <div class="rate"><div class="old">نسبة عقدك<b>${l.oldRate}%</b>سنويًا (ثابتة)</div><div class="new">تمويل جديد اليوم<b>${l.newRate}%</b>متوسط السوق</div></div></div>
 <div class="card table"><div class="r hl"><span>المطلوب كاش للبائع</span><b class="num">${fmt(l.cash)}</b></div>
 <div class="r"><span>المتبقي لجهة التمويل (${l.left} قسط × ${fmt(l.monthly)})</span><b class="num">${fmt(l.remain)}</b></div>
 <div class="r"><span>القيمة السوقية بعد الفحص</span><b class="num">${fmt(l.market)}</b></div>
 <div class="r"><span>فرق السعر عن السوق</span><b class="num">+ ${fmt(k.price)}</b></div><div class="r"><span>توفير فرق نسبة الربح</span><b class="num">+ ${fmt(k.rate)}</b></div>
 <div class="r"><span>عمولة المنصة 1.25% (عند الإتمام فقط)</span><b class="num">− ${fmt(k.fee)}</b></div>
 <div class="r total"><span>توفيرك المتوقع</span><span class="num">+ ${fmt(k.gain)} ر.س</span></div></div>
 <div class="sec-t"><h3>تقرير الفحص</h3><button class="link">التقرير الكامل</button></div>
 <div class="card insp"><div class="ring" style="--p:${l.score}"><div>${l.score}</div></div><ul><li>${ic('check','xs')} المحرك وناقل الحركة سليم</li><li>${ic('check','xs')} لا حوادث مسجلة في السجل</li><li>${ic('check','xs')} الضمان: ${l.warranty}</li><li>${ic('info','xs')} رش خفيف بالصدام الأمامي</li></ul></div>
 <div class="sec-t"><h3>حالة التحقق</h3><span class="pill ok">4 من 4</span></div>
 <div class="card vlist">${[['عقد التمويل','مراجَع'],['كشف الحساب والمتبقي','مؤكد من جهة التمويل'],['الاستمارة والتأمين','سارية'],['قابلية نقل الالتزام','حسب أهلية المشتري']].map(v=>`<div class="vitem"><span class="c">${ic('check','xs')}</span><span>${v[0]}</span><span>${v[1]}</span></div>`).join('')}</div>
 <p class="note">نقل الالتزام يتطلب موافقة جهة التمويل على أهلية المشتري (الدخل والسجل الائتماني). نتحقق من أهليتك مبدئيًا قبل الحجز حتى ما يضيع وقتك.</p>`;}
 return `<div class="scroll">${head}<div class="dsheet"><div class="pad" style="padding-top:20px">${body}</div></div></div>${top}
 <div class="gbot"><div class="ctabar"><button class="btn gl" aria-label="محادثة">${ic('chat','s')}</button><button class="btn pri">${re?'احجز الفرصة وكلّم مسؤول الحالة':'تحقق من أهليتك واحجز معاينة'}</button></div></div>`;
}

/* ================= CALC ================= */
function fld(k,label,val,u,hint,grp){return `<div class="field"><label for="f-${k}">${label} <span class="req">*</span></label><div class="inp"><input id="f-${k}" inputmode="numeric" data-k="${k}" ${grp?`data-g="${grp}"`:''} value="${fmt(val)}"><span class="u">${u}</span></div>${hint?`<small>${hint}</small>`:''}</div>`}
function calc(){const re=S.v==='re', o=S.calcTab==='owner';let fields='';
 if(o&&re){const c=S.cre;fields=`${fld('price','إجمالي سعر الوحدة في العقد',c.price,'ر.س','السعر الكلي المكتوب في عقدك مع المطوّر')}${fld('paid','إجمالي اللي دفعته لين اليوم',c.paid,'ر.س','الدفعة الأولى + كل الأقساط المسددة')}${fld('years','دفعت المبلغ على كم سنة؟',c.years,'سنة','من تاريخ التعاقد لآخر قسط سددته')}
 <div class="field"><label>نسبة خصم الإلغاء في عقدك</label><div class="opts">${[5,10,15].map(p=>`<button class="opt" data-pct="${p}" aria-pressed="${c.pct===p}">${p}%</button>`).join('')}<button class="opt">ما أعرف</button></div></div>`}
 else if(o){const c=S.ccar;fields=`${fld('total','إجمالي قيمة عقد التمويل',c.total,'ر.س','شامل الدفعة الأولى والأرباح')}${fld('paid','إجمالي اللي دفعته لين اليوم',c.paid,'ر.س','الدفعة الأولى + الأقساط المسددة')}${fld('remain','المتبقي لجهة التمويل',c.remain,'ر.س','من كشف الحساب أو تطبيق البنك')}${fld('market','القيمة السوقية لسيارتك (إن عرفتها)',c.market,'ر.س','نحددها بدقة بعد الفحص')}`}
 else{const b=S.buy;fields=`${fld('cash','الكاش المتاح معك الحين',b.cash,'ر.س','المبلغ اللي تقدر تدفعه فورًا للبائع','buy')}${fld('inst',re?'أقصى قسط يريحك':'أقصى قسط شهري يريحك',b.inst,'ر.س','','buy')}
 ${re?`<div class="field"><label>نظام القسط</label><div class="opts">${['شهري','ربع سنوي','نصف سنوي','سنوي'].map(f=>`<button class="opt" data-freq="${f}" aria-pressed="${b.freq===f}">${f}</button>`).join('')}</div></div>`:''}`}
 return `<div class="scroll"><div class="pad" style="padding-top:0">
 <div class="tabs2"><button data-ctab="owner" aria-pressed="${o}">${re?'أنا صاحب وحدة':'أنا صاحب سيارة'}</button><button data-ctab="buyer" aria-pressed="${!o}">أنا مشتري</button></div>
 <div class="card form">${fields}</div><div id="calcOut" class="result">${calcOut()}</div>
 <p class="note">الحسبة استرشادية وما تغني عن مراجعة عقدك الفعلي. النسب والشروط تختلف من عقد لعقد.</p></div></div>
 ${topBar(`<div class="ahead" style="padding-bottom:4px"><span style="width:38px"></span>${wm()}<span style="width:38px"></span></div><h1 class="largetitle" style="padding-bottom:2px">حاسبة الخروج الآمن</h1><p class="muted" style="margin:0 18px 10px;font-size:12.5px">${re?'الفرق الحقيقي بين إلغاء التعاقد ونقله لمشتري جديد':'الفرق بين إرجاع السيارة لجهة التمويل ونقل الالتزام'}</p>${seg()}`)}
 ${tabbar()}`}
function calcOut(){const re=S.v==='re';
 if(S.calcTab==='owner'&&re){const c=S.cre;const ded=c.price*c.pct/100;const back=Math.max(0,c.paid-ded);const lossPct=c.paid?Math.round(ded/c.paid*100):0;
  return `<div class="rcard bad"><div class="t">${ic('x','s')} لو ألغيت التعاقد</div><div class="r"><span>خصم الإلغاء (${c.pct}% من سعر الوحدة)</span><b>− ${fmt(ded)}</b></div><div class="r"><span>اللي يرجع لك</span><b class="num bigv">${fmt(back)} ر.س</b></div><div class="r"><span>غالبًا على دفعات خلال</span><b>${Math.max(1,Math.round(c.years*8))} شهر</b></div><div class="r"><span>خسارتك من فلوسك</span><b>${Math.min(100,lossPct)}%</b></div></div>
  <div class="rcard good"><div class="t">${ic('check','s')} لو تنازلت عن طريق تخارج</div><div class="r"><span>تسترد كل اللي دفعته كاش</span><b class="num bigv">${fmt(c.paid)} ر.س</b></div><div class="r"><span>عمولة المنصة عليك</span><b>صفر</b></div></div>
  <div class="delta"><small>الفرق لصالحك</small><span class="num">+ ${fmt(c.paid-back)} ر.س</span></div><button class="btn pri block" data-go="sell">اطلب تقرير الخروج المجاني</button>`}
 if(S.calcTab==='owner'){const c=S.ccar;const auction=Math.round(c.market*.8), fees=8000;const back=auction-c.remain-fees;const eq=Math.max(0,c.market-c.remain);
  return `<div class="rcard bad"><div class="t">${ic('x','s')} لو رجّعت السيارة لجهة التمويل</div><div class="r"><span>بيع بالمزاد (≈80% من القيمة)</span><b>${fmt(auction)}</b></div><div class="r"><span>سداد المتبقي + رسوم الاسترداد</span><b>− ${fmt(c.remain+fees)}</b></div><div class="r"><span>${back>=0?'اللي يرجع لك':'تبقى مديون بـ'}</span><b class="num bigv" style="${back<0?'color:var(--a-red)':''}">${fmt(Math.abs(back))} ر.س</b></div></div>
  <div class="rcard good"><div class="t">${ic('check','s')} لو نقلت الالتزام عن طريق تخارج</div><div class="r"><span>تستلم قيمة حقك كاش، بحد أقصى</span><b class="num bigv">${fmt(Math.min(eq,c.paid))} ر.س</b></div><div class="r"><span>والمشتري يكمل</span><b>${fmt(c.remain)} للبنك</b></div><div class="r"><span>عمولة المنصة عليك</span><b>صفر</b></div></div>
  <div class="delta"><small>الفرق لصالحك</small><span class="num">+ ${fmt(Math.min(eq,c.paid)-back)} ر.س</span></div><button class="btn pri block" data-go="sell">اطلب فحص وتقييم مجاني</button>`}
 const b=S.buy;const pool=re?RE:CARS;const m=pool.filter(l=>l.cash<=b.cash&&(re?l.inst:l.monthly)<=b.inst);
 return `<div class="delta"><small>فرص تناسب ميزانيتك الحين</small><span class="num">${m.length} من ${pool.length}</span></div>
 ${m.slice(0,3).map(l=>resRow(l)).join('')||'<p class="note">ما فيه فرص مطابقة حاليًا. سجّل قدرتك الشرائية ونرسل لك أول ما تنزل فرصة.</p>'}
 <button class="btn pri block" data-go="buy">سجّل قدرتك الشرائية وفعّل التنبيهات</button>`}

/* ================= SELL ================= */

function tx(l,v,u='',h=''){return `<div class="field"><label>${l}</label><div class="inp"><input value="${v}" aria-label="${l}">${u?`<span class="u">${u}</span>`:''}</div>${h?`<small>${h}</small>`:''}</div>`}
function sell(){const re=S.v==='re', s=S.sellStep;let body='';
 if(s===1)body=re?`${tx('المطوّر','دار المسار للتطوير')}${tx('اسم المشروع','ضاحية الياسمين')}${tx('المدينة والحي','الرياض · حي الياسمين')}<div class="field"><label>نوع الوحدة</label><div class="opts">${['شقة','فيلا','تاون هاوس','محل'].map((t,i)=>`<button class="opt" aria-pressed="${i===1}">${t}</button>`).join('')}</div></div>`
  :`${tx('الماركة والموديل','تويوتا لاندكروزر GXR')}${tx('سنة الصنع','2024')}${tx('الممشى الحالي','38,000 كم')}<div class="field"><label>نوع التمويل</label><div class="opts"><button class="opt" aria-pressed="true">تأجير منتهي بالتمليك</button><button class="opt">مرابحة</button></div></div>${tx('جهة التمويل','بنك / شركة تمويل')}`;
 if(s===2)body=re?`${tx('إجمالي سعر الوحدة في العقد','2,400,000','ر.س')}${tx('إجمالي اللي دفعته لين اليوم','600,000','ر.س')}<div class="check"><span class="box">${ic('check','xs')}</span><span>أؤكد إني فاهم إن المبلغ اللي بستلمه هو اللي دفعته بالضبط، بدون أي زيادة.</span></div>${tx('سعر نفس الوحدة من المطوّر اليوم (إن عرفته)','2,850,000','ر.س','نستخدمه لنحسب للمشتري كم يوفر. إذا مو متأكد اتركه ونتحقق إحنا.')}`
  :`${tx('إجمالي قيمة عقد التمويل','412,000','ر.س')}${tx('اللي دفعته لين اليوم','172,600','ر.س')}${tx('المتبقي لجهة التمويل','239,400','ر.س')}<div class="check"><span class="box">${ic('check','xs')}</span><span>أفهم إن المطلوب من المشتري ما يتجاوز قيمة حقي الفعلية (القيمة السوقية بعد الفحص ناقص المتبقي)، ولا يتجاوز اللي دفعته.</span></div>`;
 if(s===3){const docs=re?[['file','عقد البيع على الخارطة',1],['wallet','إيصالات السداد',1],['file','كشف المتبقي من المطوّر',0],['user','الهوية الوطنية',0]]:[['file','عقد التمويل',1],['wallet','كشف الحساب',1],['car','الاستمارة',0],['camera','صور السيارة (8)',0]];
  body=`<div class="ups">${docs.map(d=>`<button class="up ${d[2]?'done':''}" data-up="1"><span class="ic">${ic(d[2]?'check':d[0])}</span><b>${d[1]}</b><small>${d[2]?'تم الرفع · PDF':'صوّر أو ارفع ملف'}</small></button>`).join('')}</div>
  <button class="btn gl block">${ic('scan','s')} افتح الماسح الذكي</button><p class="note">الماسح يقص الصفحة ويحسّن وضوحها تلقائيًا. ملفاتك مشفّرة وما يشوفها إلا فريق المراجعة.</p>`}
 if(s===4)body=`<div class="choice"><button class="ch" data-silent="1" aria-pressed="${S.silent}"><span class="ic">${ic('eyeoff')}</span><span><b>خروج صامت</b><span>ما ننشر إعلان علني. نعرض ${re?'وحدتك':'سيارتك'} على مشترين مسجلين ومؤهلين فقط.</span></span></button>
  <button class="ch" data-silent="0" aria-pressed="${!S.silent}"><span class="ic">${ic('megaphone')}</span><span><b>عرض عام على المنصة</b><span>تظهر في الفرص لكل المستخدمين. أسرع بيعًا، وبدون اسمك أو رقمك.</span></span></button></div>
  <div class="field"><label>أنسب وقت نتواصل معك</label><div class="opts">${['الصباح','بعد العصر','المساء'].map((t,i)=>`<button class="opt" aria-pressed="${i===1}">${t}</button>`).join('')}</div></div>`;
 if(s===5)body=`<div class="card table">${(re?[['الأصل','فيلا دوبلكس · ضاحية الياسمين'],['المدينة','الرياض · حي الياسمين'],['سعر العقد','2,400,000 ر.س'],['تستلم كاش','600,000 ر.س'],['المستندات','4 من 4'],['طريقة العرض',S.silent?'خروج صامت':'عرض عام']]:[['الأصل','لاندكروزر GXR 2024'],['التمويل','تأجير منتهي بالتمليك'],['المتبقي','239,400 ر.س'],['تستلم كاش','حتى 115,600 ر.س بعد الفحص'],['المستندات','4 من 4'],['طريقة العرض',S.silent?'خروج صامت':'عرض عام']]).map(r=>`<div class="r"><span class="muted">${r[0]}</span><b>${r[1]}</b></div>`).join('')}
  <div class="r total"><span>عمولة المنصة عليك</span><span>صفر</span></div></div><p class="note">بالإرسال توافق على الشروط وسياسة الخصوصية. نراجع طلبك خلال يومي عمل.</p>`;

 home:{t:'الرئيسية',d:['بانر علوي متحرك بثلاث مشاهد حية: مدينة بنوافذ تضوي، سيارة على طريق متحرك، ورسم بياني ينمو. يتبدل كل 5 ثواني بمؤشر تقدم مثل الستوري.','حقل بحث زجاجي فوق البانر مع نص توضيحي يتبدل. اضغطه يفتح البحث.','لايف: شريط «مباشر» يتحدث، أرقام تعد، خطوط بيانية تنرسم، خطوات «كيف نشتغل» تتقدم لوحدها، وإشعار يظهر من فوق بعد ثواني.','حاسبة مصغرة بمؤشر سحب تحدّث المقارنة مباشرة.','عند النزول يظهر شريط علوي زجاجي مضغوط.','زر الشمس والقمر في البانر يبدّل بين الوضع الفاتح والداكن بانتقال دائري يطلع من الزر نفسه. التطبيق يفتح فاتح افتراضيًا، والوضع التلقائي في الإعدادات يتبع إعداد الجهاز.'],l:()=>S.v==='re'?['الرسالة: البائع يسترد المدفوع كاملًا كاش، والمشتري يأخذ سعر التعاقد القديم.','الحاسبة المصغرة: الإلغاء = المدفوع − 10% من سعر الوحدة، والتنازل = المدفوع كاملًا.']:['السيارة تنزل قيمتها مع الوقت، فالبائع يستلم قيمة حقه = القيمة السوقية بعد الفحص − المتبقي، وبحد أقصى اللي دفعه.','الحاسبة المصغرة: الاسترداد = 80% من القيمة − المتبقي − الرسوم.']},
 search:{t:'البحث',d:['طبقة زجاجية بتمويه كامل، والكيبورد يفتح على طول.','قبل الكتابة: عمليات بحث سابقة، مدن رائجة، وفرص رائجة. مع الكتابة: نتائج مباشرة مقسمة عقارات وسيارات مع تظليل الكلمة.','جرّب تكتب: الرياض، جدة، لكزس، فيلا.'],l:['البحث يغطي المجالين، والنتيجة تفتح التفاصيل وتحوّل المجال تلقائيًا.','إذا ما فيه نتائج يعرض «سجّل طلبك» عشان ما يضيع المستخدم.']},
 list:{t:'الفرص المتاحة',d:['عنوان كبير بأسلوب iOS، و segmented control بخلفية تنزلق، وشرائح الترتيب زجاجية.','البطاقات تدخل بتتابع، وزر المفضلة ينبض لما تضغطه.'],l:()=>['ترتيب: الأنسب لي، الأحدث، الأقل كاش، أقل قسط، الأكبر مكسب، جاهزة للنقل.'],f:()=>S.v==='re'?'<b>مكسب المشتري</b> = سعر السوق − (الكاش + المتبقي) − 1.25% × سعر التعاقد':'<b>توفير المشتري</b> = (القيمة السوقية − الكاش − المتبقي) + المتبقي × فرق نسبة الربح × السنوات المتبقية − 1.25%'},
 detail:{t:'تفاصيل الفرصة',d:['صورة بعرض كامل وعليها ورقة زجاجية تطلع من تحت، وأزرار دائرية زجاجية فوقها.','رقم المكسب يعد، وأعمدة سعر العقد مقابل السوق تكبر بالتتابع.'],l:()=>S.v==='re'?['كل رقم بمصدره، والمكسب بعد خصم 1.25%.','التحقق 4 بنود: العقد، الإيصالات، الرصيد المؤكد، قابلية التنازل.']:['تقرير الفحص ونسبة الربح القديمة مقابل نسبة السوق اليوم.','الحجز يبدأ بتحقق مبدئي من أهلية المشتري عند جهة التمويل.']},
 calc:{t:'حاسبة الخروج الآمن',d:['النتائج تتحدث مع كل رقم تكتبه، وبطاقات النتيجة تدخل بحركة.'],l:()=>['تبويب المشتري يطابق الميزانية مع الفرص المتاحة.'],f:()=>S.v==='re'?'<b>الإلغاء</b>: يرجع لك = المدفوع − (نسبة الخصم × سعر الوحدة)<br><b>التنازل</b>: يرجع لك = المدفوع كاملًا، عمولة صفر':'<b>الاسترداد</b>: 80% × القيمة السوقية − المتبقي − الرسوم<br><b>نقل الالتزام</b>: أقل قيمة من (القيمة السوقية − المتبقي) و (المدفوع)'},
 sell:{t:'رحلة البائع (6 خطوات)',d:['شريط تقدم يمتلئ مع كل خطوة، والأزرار ثابتة في شريط زجاجي تحت. الإرسال ينتهي بعلامة صح تنرسم وتنبض.'],l:()=>['بيانات، أرقام مع إقرار «بدون زيادة»، مستندات بالماسح، طريقة العرض (خروج صامت افتراضيًا)، مراجعة، إرسال.','«ملّاك فقط» عشان ما يدخل وسيط يرفع السعر.']},
 buy:{t:'القدرة الشرائية',d:['3 خطوات بنفس شريط التقدم. عدد الفرص المطابقة يعد في آخر خطوة.'],l:()=>['في السيارات نطلب الراتب لأن جهة التمويل لازم توافق على المشتري.','المشترين المسجلين يوصلهم إشعار قبل النشر العام.']},
 deal:{t:'صفقتي النشطة',d:['تفتح من مربع «صفقة نشطة» في حسابي بحركة push، والتاب بار يفضل ظاهر على «حسابي».','كارت الخطوة القادمة بتقويم ملوّن، والخطوة الحالية في المراحل تنبض.'],l:()=>['كل اللي يحتاجه البائع في مكان واحد: المبلغ اللي بيستلمه، الموعد القادم، المراحل الخمس، حالة كل مستند، ومسؤول الحالة.','آخر مستند دايمًا «بانتظار المشتري» لأن موافقة المطوّر أو جهة التمويل تحصل بعد اختيار المشتري.']},
 leads:{t:'المهتمين',d:['ملخص بالأرقام فوق، وبعدها كروت المشترين تدخل بتتابع.'],l:()=>['المشتري يظهر باسم مختصر ومدينة بس عشان الخصوصية، والتواصل يمر عن طريق مسؤول الحالة.','كل مشتري عليه حالته (معاينة، طلب مستندات، يدرس) وشارات الأهلية، وفي السيارات تظهر موافقة البنك المبدئية.']},
 saved:{t:'المحفوظة',d:['نفس كروت الفرص، وشيل القلب يحدّث القائمة على طول. لو القائمة فاضية تظهر شاشة توجه المستخدم للفرص.'],l:()=>['المحفوظة تجمع العقارات والسيارات مع بعض، وتنبيه عند تغيّر السعر أو الحالة.']},
 acct:{t:'حسابي ومتابعة الصفقة',d:['هيدر كحلي فيه توهج يتحرك، والخطوة الحالية في المتتبع تنبض.'],l:()=>['المتتبع يعكس نفس الخطوات الخمس، ومسؤول حالة واحد لكل صفقة.','بصمة الوجه والدولة في الإعدادات.']}
};
const RAIL=[['البداية',[['splash','السبلاش'],['onb','الترحيب']]],['الرئيسية',[['home','الرئيسية'],['search','البحث']]],['المشتري',[['list','الفرص المتاحة'],['detail','تفاصيل الفرصة'],['buy','القدرة الشرائية']]],['البائع',[['calc','حاسبة الخروج'],['sell','رحلة التنازل']]],['الحساب',[['acct','حسابي'],['deal','صفقتي النشطة'],['leads','المهتمين'],['saved','المحفوظة']]]];

/* ================= render ================= */
const app=document.getElementById('app'), host=document.getElementById('host'), notes=document.getElementById('notes'), rail=document.getElementById('rail');
const MAP={splash,onb:onboarding,home,list,detail,calc,sell,buy,acct,deal,leads,saved};
const ORDER=['splash','onb','home','list','detail','buy','calc','sell','acct','deal','leads','saved'];
function render(mode){
 timers.forEach(t=>{clearInterval(t);clearTimeout(t)});timers=[];uid=0;
 const keep=mode==='keep';const oldSc=host.querySelector('.scroll');const top=keep&&oldSc?oldSc.scrollTop:0;
 app.className=appCls();
 const anim=keep?'':(mode||'fade');
 host.innerHTML=`<div class="screen ${anim}">${MAP[S.screen]()}${S.search?searchOverlay():''}${S.sheet?sheet():''}</div>`;
 const sc=host.querySelector('.scroll');
 const gt=host.querySelector('.gtop:not(.float)');
 if(sc){ if(gt){sc.style.paddingTop=gt.offsetHeight+'px'} sc.scrollTop=top; }
 mount();
 // rail + notes
 if(!rail)return;const cur=S.search?'search':S.screen;let n=1;
 rail.innerHTML=RAIL.map(([g,items])=>`<h2>${g}</h2>`+items.map(([k,l])=>`<button type="button" data-rail="${k}" aria-current="${cur===k}"><span class="n">${String(n++).padStart(2,'0')}</span>${l}</button>`).join('')).join('');
 const N=NOTES[cur];const L=typeof N.l==='function'?N.l():N.l;
 notes.innerHTML=`<span class="eyebrow">${S.v==='re'?'عقارات':'سيارات'} · ${N.t}</span><h3>${N.t}</h3><h4>الحركة والتجربة</h4><ul>${N.d.map(x=>`<li>${x}</li>`).join('')}</ul><h4>منطق البيزنس</h4><ul>${L.map(x=>`<li>${x}</li>`).join('')}</ul>${N.f?`<div class="formula">${N.f()}</div>`:''}${N.replay?'<button class="replay" data-rail="splash">إعادة تشغيل السبلاش</button>':''}`;
 document.querySelectorAll('.vtoggle [data-v]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===S.v));
 document.querySelectorAll('.vtoggle [data-theme-set]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.themeSet===S.theme));
}
function countUp(root){root.querySelectorAll('[data-count]').forEach(el=>{const to=+el.dataset.count, dec=+(el.dataset.dec||0);
 if(RM){el.textContent=dec?to.toFixed(dec):fmt(to);return}
 const t0=performance.now(), d=1300;(function f(t){const p=Math.min(1,(t-t0)/d), e=1-Math.pow(1-p,3), v=to*e;el.textContent=dec?v.toFixed(dec):fmt(v);if(p<1)requestAnimationFrame(f)})(t0)})}
function mount(){
 countUp(host);
 if(S.screen==='splash'&&!S.search){later(leaveSplash,3100)}
 if(S.screen==='onb'){const st=host.querySelector('.onb');let x0=null;
  st.addEventListener('pointerdown',e=>{x0=e.clientX});
  st.addEventListener('pointerup',e=>{if(x0===null)return;const dx=e.clientX-x0;x0=null;if(Math.abs(dx)<50)return;
   const n=dx>0?Math.min(ONB.length-1,S.onb+1):Math.max(0,S.onb-1);if(n!==S.onb){S.onb=n;render(dx>0?'push':'pop')}});}
 if(S.screen==='home'){
  const sc=host.querySelector('#hs'), ft=host.querySelector('.gtop.float'), bn=host.querySelector('#banner');
  sc.addEventListener('scroll',()=>{ft.classList.toggle('show',sc.scrollTop>250);if(!RM)bn.querySelector('.slides').style.transform=`translateY(${sc.scrollTop*.35}px)`},{passive:true});
  const sl=SLIDES[S.v];
  every(()=>{S.slide=(S.slide+1)%sl.length;bn.querySelectorAll('.bslide').forEach((b,i)=>b.classList.toggle('on',i===S.slide));
   bn.querySelectorAll('.bprog i').forEach((b,i)=>{b.className=i<S.slide?'done':i===S.slide?'on':''})},5000);
  let ti=0;every(()=>{ti=(ti+1)%TICK[S.v].length;const t=TICK[S.v][ti];const el=host.querySelector('#tick');if(el){el.innerHTML=`<span>${t[1]}</span>`;host.querySelector('#tickt').textContent=t[2]}},3200);
  let pi=0;every(()=>{pi=(pi+1)%PH[S.v].length;const el=host.querySelector('#ph');if(el)el.innerHTML=`<span>${PH[S.v][pi]}</span>`},2800);
  every(()=>{S.flowI=(S.flowI+1)%5;const f=host.querySelector('#flow');if(f)f.innerHTML=flowHTML()},1800);
  later(()=>{if(S.screen!=='home'||S.search)return;const l=(S.v==='re'?RE:CARS)[1];const d=document.createElement('div');d.className='notif-toast';d.dataset.open=l.id;
   d.innerHTML=`<span class="ai">${EMBLEM.replace('<svg','<svg style="width:32px;height:auto"').replace(/id="em/g,'id="emx').replace(/url\(#em/g,'url(#emx')}</span><div><b>فرصة جديدة تطابق طلبك</b><span>${nameOf(l)} · مكسب +${fmt(gainOf(l))}</span></div><time>الحين</time>`;
   host.querySelector('.screen').appendChild(d);later(()=>d.remove(),4800)},4200);
 }
 if(S.search){const i=host.querySelector('#sxq');if(i){i.focus({preventScroll:true});i.setSelectionRange(i.value.length,i.value.length)}}
}
function go(s,mode){
 if(s==='search'){S.search=true;S.q='';if(!['home','list'].includes(S.screen))S.screen='home';render('keep');return}
 const from=ORDER.indexOf(S.screen), to=ORDER.indexOf(s);
 S.prev=S.screen;S.screen=s;S.sheet=false;S.search=false;
 if(s==='sell')S.sellStep=1;if(s==='buy')S.buyStep=1;if(s==='home')S.slide=0;
 const tabs=['home','list','calc','acct'];
 render(mode||(tabs.includes(s)&&tabs.includes(S.prev)?'fade':(to<from?'pop':'push')));
}

/* splash -> onboarding: fade + zoom out, onboarding fades in */
let leaving=false;
function leaveSplash(){if(S.screen!=='splash'||leaving)return;leaving=true;const sp=host.querySelector('.splash');
 const done=()=>{leaving=false;S.onb=0;go('onb','enter')};
 if(RM||!sp){done();return}sp.classList.add('out');setTimeout(done,420)}

/* ================= theme ================= */
function setTheme(t,el){const was=isDark();S.theme=t;const now=isDark();
 const apply=()=>{app.className=appCls();render('keep')};
 if(was===now||RM||!document.startViewTransition){apply();return}
 const r=el.getBoundingClientRect(), de=document.documentElement;
 de.style.setProperty('--vx',(r.left+r.width/2)+'px');de.style.setProperty('--vy',(r.top+r.height/2)+'px');
 document.startViewTransition(apply)}
if(MQ&&MQ.addEventListener)MQ.addEventListener('change',()=>{if(S.theme==='auto'){app.className=appCls();render('keep')}});
new MutationObserver(()=>{if(S.theme==='auto'){app.className=appCls();render('keep')}}).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

/* ================= events ================= */
document.addEventListener('click',e=>{
 const th=e.target.closest('[data-theme-set],[data-theme-flip]');
 if(th){const next=th.dataset.themeFlip?(isDark()?'light':'dark'):th.dataset.themeSet;setTheme(next,th);return}
 if(e.target.closest('.splash')){leaveSplash();return}
 const sh=e.target.closest('[data-act="sheet"]');if(sh){S.sheet=true;S.search=false;render('keep');return}
 const t=e.target.closest('button,[data-open],.scrim');if(!t)return;
 if(t.dataset.rail){go(t.dataset.rail==='search'?'search':t.dataset.rail);if(t.dataset.rail==='onb'){S.onb=0;render('fade')}return}
 if(t.dataset.fav){e.stopPropagation();const id=t.dataset.fav;S.favs.has(id)?S.favs.delete(id):S.favs.add(id);if(S.screen==='saved'){render('keep');return}
 host.querySelectorAll(`[data-fav="${id}"]`).forEach(b=>{b.setAttribute('aria-pressed',S.favs.has(id));b.classList.remove('bump');void b.offsetWidth;b.classList.add('bump')});return}
 if(t.dataset.act==='sheet'){e.stopPropagation();S.sheet=true;S.search=false;render('keep');return}
 if(t.dataset.v){const nv=t.dataset.v;if(nv===S.v&&!t.classList.contains('bcta'))return;S.v=nv;S.slide=0;if(S.screen==='detail')S.id=nv==='re'?'r1':'c1';
  if(S.screen==='onb'){app.className=appCls();host.querySelectorAll('.vp').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===S.v));render('keep');return}
  render(t.closest('.board .vtoggle')||t.closest('.seg')?'keep':'fade');return}
 if(t.dataset.back){go(t.dataset.back,'pop');return}
 if(t.dataset.go){go(t.dataset.go);return}
 if(t.dataset.open){const id=t.dataset.open;S.v=id[0]==='c'?'car':'re';S.id=id;go('detail','push');return}
 if(t.dataset.onb){S.onb=+t.dataset.onb;render('push');return}
 if(t.dataset.role){S.role=t.dataset.role;host.querySelectorAll('.rp').forEach(b=>b.setAttribute('aria-pressed',b===t));const b=host.querySelector('.onb-foot [data-go]');if(b)b.dataset.go=S.role==='sell'?'home':'list';return}
 if(t.dataset.sort){S.sort=+t.dataset.sort;render('keep');return}
 if(t.dataset.ctab){S.calcTab=t.dataset.ctab;render('keep');return}
 if(t.dataset.pct){S.cre.pct=+t.dataset.pct;host.querySelectorAll('[data-pct]').forEach(b=>b.setAttribute('aria-pressed',b===t));host.querySelector('#calcOut').innerHTML=calcOut();return}
 if(t.dataset.freq){S.buy.freq=t.dataset.freq;host.querySelectorAll('[data-freq]').forEach(b=>b.setAttribute('aria-pressed',b===t));return}
 if(t.dataset.sstep){S.sellStep=Math.min(6,+t.dataset.sstep);render(S.sellStep===6?'push':'keep');return}
 if(t.dataset.bstep){S.buyStep=+t.dataset.bstep;render('keep');return}
 if(t.dataset.silent){S.silent=t.dataset.silent==='1';host.querySelectorAll('.ch').forEach(b=>b.setAttribute('aria-pressed',b===t));return}
 if(t.dataset.acct){if(S.screen!=='acct'){S.acct=t.dataset.acct;go('acct');return}S.acct=t.dataset.acct;render('keep');return}
 if(t.dataset.sq){S.q=t.dataset.sq;const i=host.querySelector('#sxq');if(i)i.value=S.q;host.querySelector('#sxb').innerHTML=searchBody();return}
 if(t.dataset.up){t.classList.add('done');t.querySelector('.ic').innerHTML=ic('check');t.querySelector('small').textContent='تم الرفع · PDF';return}
 const a=t.dataset.act;
 if(a==='search'){go('search');return}
 if(a==='sxclose'){S.search=false;render('keep');return}
 if(a==='close'){if(t.classList.contains('scrim')&&e.target.closest('[data-stop]'))return;S.sheet=false;render('keep');return}
 if(t.classList.contains('opt')){const grp=t.parentElement;if(grp.dataset.multi){t.setAttribute('aria-pressed',t.getAttribute('aria-pressed')!=='true')}else{grp.querySelectorAll('.opt').forEach(b=>b.setAttribute('aria-pressed',b===t))}return}
 if(t.classList.contains('sw')){const v=t.getAttribute('aria-pressed')!=='true';t.setAttribute('aria-pressed',v);if(a==='face')S.faceid=v;return}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.open){const id=e.target.dataset.open;S.v=id[0]==='c'?'car':'re';S.id=id;go('detail','push')}
 if(e.key==='Escape'&&(S.search||S.sheet)){S.search=false;S.sheet=false;render('keep')}});
host.addEventListener('input',e=>{const el=e.target;
 if(el.id==='sxq'){S.q=el.value;host.querySelector('#sxb').innerHTML=searchBody();return}
 if(el.id==='mini'){S.mini[S.v]=+el.value;const m=miniCalc();el.style.setProperty('--p',m.p+'%');host.querySelector('#mcalc .top b').innerHTML=`${fmt(m.val)}<span class="cur">ر.س</span>`;host.querySelector('#cmp').innerHTML=cmpRows(m);return}
 if(el.id==='frng'){const p=(el.value-el.min)/(el.max-el.min)*100;el.style.setProperty('--p',p+'%');host.querySelector('#rv').textContent=fmt(+el.value);return}
 const k=el.dataset.k;if(!k)return;const v=+el.value.replace(/[^\d]/g,'')||0;
 const o=el.dataset.g==='buy'?S.buy:(S.v==='re'?S.cre:S.ccar);o[k]=v;host.querySelector('#calcOut').innerHTML=calcOut()});
host.addEventListener('focusout',e=>{const k=e.target.dataset&&e.target.dataset.k;if(k){e.target.value=fmt(+e.target.value.replace(/[^\d]/g,'')||0)}});
render('fade');
})();
</script>

</body></html>
